  <style>
    :root {
      --bg:        #f6f8fa;
      --surface:   #ffffff;
      --fg:        #24292f;
      --muted:     #57606a;
      --border:    #d0d7de;
      --border-light: #eaeef2;
      --accent:    #0969da;
      --accent-dim: rgba(9,105,218,0.08);
      --green:     #1a7f37;
      --green-bg:  #dafbe1;
      --red:       #cf222e;
      --red-bg:    #ffebe9;
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* ═ Header ═══ */
    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header-logo {
      width: 28px; height: 28px;
      background: var(--fg);
      border-radius: 7px;
      display: grid; place-items: center;
      flex-shrink: 0;
    }
    .header-logo svg {
      width: 14px; height: 14px;
      stroke: #60a5fa; fill: none; stroke-width: 2.5;
    }
    .header-title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .header-title a {
      color: inherit;
      text-decoration: none;
    }
    .header-title a:hover { color: var(--accent); }
    .header-title span {
      color: var(--muted);
      font-weight: 400;
    }

    /* ═ Compact Nav ═══ */
    .compact-nav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 8px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      gap: 12px;
    }
    .compact-nav-left {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .nav-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 14px;
      border-radius: 6px;
      color: var(--fg);
      text-decoration: none;
      font-weight: 500;
      font-size: 13px;
      transition: background 0.12s, color 0.12s;
    }
    .nav-pill:hover {
      background: var(--accent-dim);
      color: var(--accent);
    }
    .nav-pill.active {
      background: var(--accent);
      color: #fff;
    }
    .nav-pill.active:hover {
      background: #0860c7;
    }
    .nav-pill svg {
      width: 14px; height: 14px;
      stroke: currentColor; fill: none; stroke-width: 2;
    }

    .compact-nav-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .search-group {
      display: flex;
      align-items: center;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .search-group:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }
    .search-group .search-input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .search-group .search-input-wrap svg {
      position: absolute;
      left: 8px;
      width: 14px; height: 14px;
      stroke: var(--muted); fill: none; stroke-width: 2;
      pointer-events: none;
    }
    .search-group .search-input {
      width: 170px;
      height: 30px;
      border: none;
      padding: 0 8px 0 28px;
      font-size: 12.5px;
      font-family: var(--font-sans);
      outline: none;
      background: transparent;
    }
    .search-group .search-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      height: 30px;
      padding: 0 14px;
      border: none;
      border-left: 1px solid var(--border);
      border-radius: 0 5px 5px 0;
      background: var(--bg);
      color: var(--fg);
      text-decoration: none;
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.12s;
      white-space: nowrap;
    }
    .search-group .search-btn:hover { background: #f3f4f6; }

    .compact-nav-right .current-dir-label {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12.5px;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      transition: background 0.12s;
    }
    .compact-nav-right .current-dir-label:hover {
      background: #f6f8fa;
    }
    .compact-nav-right .current-dir-label input[type="checkbox"] {
      margin: 0;
      accent-color: var(--accent);
    }

    /*  Breadcrumb Path ═══ */
    .dir-path {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 6px 24px;
      font-size: 13px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .dir-path a {
      color: var(--accent);
      text-decoration: none;
    }
    .dir-path a:hover { text-decoration: underline; }
    .dir-path .path-sep { color: var(--border); }
    .dir-path .path-current {
      color: var(--fg);
      font-weight: 500;
    }

    /*  Main Content ═══ */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
    }

    /* Title line */
    .history-title {
      font-size: 14px;
      color: var(--fg);
      margin-bottom: 16px;
      font-weight: 400;
    }
    .history-title strong {
      font-weight: 600;
    }
    .history-title .path {
      font-family: var(--font-mono);
      font-size: 13px;
    }

    /* ═ History Table (classic OpenGrok style) ═══ */
    .history-table-wrapper {
      background: var(--surface);
      overflow: hidden;
    }

    .history-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .history-table thead th {
      text-align: left;
      padding: 6px 10px;
      font-weight: 600;
      color: var(--fg);
      border-bottom: 2px solid var(--border);
      font-size: 13px;
      white-space: nowrap;
      vertical-align: bottom;
    }
    .history-table thead th:first-child {
      padding-left: 10px;
    }

    .history-table td {
      padding: 8px 10px;
      border-bottom: 1px solid var(--border-light);
      vertical-align: top;
    }

    .history-table tbody tr:hover {
      background: #f6f8fa;
    }

    /* Column widths */
    .col-revision { width: 100px; }
    .col-date     { width: 70px; }
    .col-author   { width: 260px; }
    .col-comments { width: auto; }

    /* Revision cell */
    .revision-hash {
      font-family: var(--font-mono);
      font-size: 12.5px;
      color: var(--accent);
      text-decoration: none;
      cursor: pointer;
    }
    .revision-hash:hover {
      text-decoration: underline;
    }

    /* Date cell */
    .date-day {
      font-size: 13px;
      color: var(--fg);
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
    }
    .date-year {
      font-size: 11px;
      color: var(--muted);
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
    }

    /* Author cell */
    .author-name {
      font-size: 13px;
      font-weight: 500;
    }
    .author-email {
      font-size: 11.5px;
      color: var(--muted);
      word-break: break-all;
    }

    /* Comments cell */
    .comment-entry {
      margin-bottom: 4px;
      font-size: 13px;
      line-height: 1.5;
    }
    .comment-entry::before {
      content: '• ';
      color: var(--muted);
    }
    .comment-entry.bullet::before {
      content: '* ';
      color: var(--muted);
    }
    .co-authored {
      font-size: 11.5px;
      color: var(--muted);
      margin-top: 6px;
      margin-bottom: 4px;
    }
    .show-more {
      font-size: 12px;
      color: var(--accent);
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      margin: 2px 0 4px;
    }
    .show-more:hover { text-decoration: underline; }
    .modified-files {
      margin-top: 6px;
      padding-top: 4px;
      border-top: 1px dashed var(--border-light);
    }
    .modified-files a {
      display: block;
      font-family: var(--font-mono);
      font-size: 11.5px;
      color: var(--accent);
      text-decoration: none;
      line-height: 1.6;
    }
    .modified-files a:hover {
      text-decoration: underline;
    }
    .hide-modified {
      font-size: 12px;
      color: var(--accent);
      cursor: pointer;
      text-decoration: none;
    }
    .hide-modified:hover { text-decoration: underline; }

    /* ═ Pagination ═══ */
    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 20px 0 8px;
    }
    .page-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 34px;
      height: 34px;
      padding: 0 10px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--surface);
      font-size: 13px;
      font-family: var(--font-sans);
      font-weight: 500;
      color: var(--fg);
      cursor: pointer;
      transition: all 0.12s;
      text-decoration: none;
    }
    .page-btn:hover {
      background: #f3f4f6;
      border-color: #ccc;
    }
    .page-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .page-btn:disabled {
      opacity: 0.4;
      cursor: default;
    }

    /* Footer */
    .footer {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      padding: 16px 0 24px;
    }
    .footer a {
      color: var(--accent);
      text-decoration: none;
    }
    .footer a:hover { text-decoration: underline; }

    /* ═ Responsive — Tablet ══ */
    @media (max-width: 768px) {
      .header { padding: 10px 16px; }
      .compact-nav { padding: 8px 16px; font-size: 12px; }
      .container { padding: 16px; }
      .history-table th, .history-table td { padding: 6px 8px; font-size: 12.5px; }
    }

    /* ═ Responsive — Mobile ═══ */
    @media (max-width: 600px) {
      .header { padding: 8px 12px; }
      .header-title { font-size: 14px; }

      /* Hide text labels — icon-only on mobile */
      .nav-label,
      .dir-label,
      .search-label { display: none; }

      .compact-nav { padding: 6px 12px; gap: 6px; flex-wrap: nowrap; }
      .compact-nav-left { gap: 2px; flex-shrink: 0; }
      .nav-pill { padding: 6px; border-radius: 6px; gap: 0; }
      .nav-pill svg { width: 16px; height: 16px; }

      .compact-nav-right { gap: 6px; flex-shrink: 0; }
      .search-group { flex: 1; min-width: 0; }
      .search-group .search-input { width: 70px; min-width: 0; font-size: 12px; }
      .search-group .search-btn {
        padding: 0 8px;
        gap: 0;
      }
      .search-btn-icon { display: block; width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; }
      .compact-nav-right .current-dir-label { font-size: 0; padding: 5px; gap: 0; flex-shrink: 0; border: 1px solid var(--border); }
      .compact-nav-right .current-dir-label input[type="checkbox"] { width: 16px; height: 16px; margin: 0; }

      .dir-path { padding: 5px 12px; font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

      .container { padding: 12px; }
      .history-table-wrapper { overflow-x: auto; -webkit-overflow-scrolling: touch; }
      .history-table { min-width: 600px; font-size: 13px; }
      .col-author { width: 200px; }
      .col-date { width: 60px; }
    }

    @media (max-width: 380px) {
      .search-group .search-input-wrap { display: none; }
      .search-group .search-btn {
        border-radius: 6px;
        border: 1px solid var(--border);
        padding: 6px;
      }
      .search-btn-icon { display: block; width: 16px; height: 16px; stroke: var(--fg); fill: none; stroke-width: 2; }
      .compact-nav-right .current-dir-label { padding: 4px; }
      .compact-nav-right .current-dir-label input[type="checkbox"] { width: 18px; height: 18px; }
    }
  </style>
</head>

        author: '王芳',
        email: '<wangfang@example.com>',
        comments: [
          { text: '初始项目结构搭建', type: 'entry' },
          { text: '配置 Gradle 构建系统', type: 'bullet' },
          { text: '添加基础依赖', type: 'bullet' },
        ],
        separator: null,
        coAuthored: null,
        showMore: false,
        modifiedFiles: [
          '/build.gradle',
          '/settings.gradle',
          '/gradle.properties',
          '/gradlew',
          '/gradlew.bat',
        ],
      },
    ];

    // ── Render history table ──
    function renderHistory() {
      var tbody = document.getElementById('history-tbody');
      var html = '';
      historyData.forEach(function(item) {
        html += '<tr>';

        // Revision
        html += '<td class="col-revision">';
        html += '<a href="file-history-diff.html?rev=' + item.hash + '" class="revision-hash">' + item.hash + '</a>';
        html += '</td>';

        // Date
        html += '<td class="col-date">';
        html += '<div class="date-day">' + item.date.day + '</div>';
        html += '<div class="date-year">' + item.date.year + '</div>';
        html += '</td>';

        // Author
        html += '<td class="col-author">';
        html += '<div class="author-name">' + item.author + '</div>';
        html += '<div class="author-email">' + item.email + '</div>';
        html += '</td>';

        // Comments
        html += '<td class="col-comments">';
        item.comments.forEach(function(c) {
          var cls = c.type === 'entry' ? 'comment-entry' : 'comment-entry bullet';
          html += '<div class="' + cls + '">' + c.text + '</div>';
        });
        if (item.separator) {
          html += '<div style="font-size:11px;color:var(--muted);margin:4px 0;">' + item.separator + '</div>';
        }
        if (item.coAuthored) {
          html += '<div class="co-authored">' + item.coAuthored + '</div>';
        }
        if (item.showMore) {
          html += '<a href="#" class="show-more" onclick="toggleShowMore(this); return false;">show more …</a>';
        }
        if (item.modifiedFiles && item.modifiedFiles.length) {
          html += '<div class="modified-files" data-modified>';
          item.modifiedFiles.forEach(function(f) {
            html += '<a href="code-view.html?path=' + encodeURIComponent(f) + '">' + f + '</a>';
          });
          html += '</div>';
        }
        html += '</td>';

        html += '</tr>';
      });
      tbody.innerHTML = html;
    }

    // ── Toggle modified files ──
    function toggleModifiedFiles() {
      var els = document.querySelectorAll('[data-modified]');
      var link = document.querySelector('.hide-modified');
      var hidden = false;
      els.forEach(function(el) {
        if (el.style.display === 'none') {
          el.style.display = '';
          hidden = false;
        } else {
          el.style.display = 'none';
          hidden = true;
        }
      });
      if (link) {
        link.textContent = hidden ? '>>> Show modified files' : '<<< Hide modified files';
      }
    }

    // ── Toggle show more ──
    function toggleShowMore(el) {
      var row = el.closest('tr');
      var hidden = row.querySelectorAll('.comment-hidden');
      hidden.forEach(function(h) {
        h.style.display = h.style.display === 'none' ? '' : 'none';
      });
      el.textContent = el.textContent === 'show more …' ? 'show less' : 'show more …';
    }

    // ── Pagination ──
    document.querySelectorAll('.pagination .page-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.pagination .page-btn').forEach(function(b) { b.classList.remove('active'); });
        this.classList.add('active');
      });
    });

    // ── Initialize ──
    renderHistory();
  </script>

</body>
</html>
