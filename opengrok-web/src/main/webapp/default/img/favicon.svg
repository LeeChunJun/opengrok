<?xml version="1.0" encoding="UTF-8"?>
<svg width="16" height="16" viewBox="0 0 16 16" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <title>OpenGrok favicon</title>
    <!--
        Matches the OpenGrok homepage logo: dark rounded plate + light-blue
        magnifying glass (pageheader.jspf / .common-page-header-logo).
        Kept on a 16x16 viewBox so it renders crisply at every tab/DPI.
    -->
    <rect x="0" y="0" width="16" height="16" rx="3.2" ry="3.2" fill="#24292f"/>
    <g transform="translate(3.5, 4)" stroke="#60a5fa" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <circle cx="4.4" cy="4.4" r="2.8"/>
        <line x1="6.6" y1="6.6" x2="8.4" y2="8.4"/>
    </g>
</svg>