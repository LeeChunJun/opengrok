<?xml version="1.0" encoding="UTF-8"?>
<svg width="16" height="16" viewBox="0 0 16 16" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <title>OpenGrok pinned-tab mask</title>
    <!--
        Safari pinned-tab mask icon. The whole non-transparent area is
        rendered in the color set on <link rel="mask-icon" color="…">, so
        the artwork must be a single-color silhouette on transparent
        background — no fills, no dark plate. Mirrors the magnifier used
        by the homepage logo (pageheader.jspf) so the brand reads the same
        in the pinned tab.
    -->
    <g stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <circle cx="7" cy="7" r="4.2"/>
        <line x1="10.1" y1="10.1" x2="13.5" y2="13.5"/>
    </g>
</svg>